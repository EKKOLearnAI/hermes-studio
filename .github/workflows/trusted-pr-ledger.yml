name: Trusted PR Ledger

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: trusted-pr-ledger-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ledger-transition:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted Base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate candidate data with trusted Base code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/verify-pr-ledger-from-base.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --remote origin \
            --fetch-ref "refs/pull/$PR_NUMBER/head" \
            --branch "pr-$PR_NUMBER" \
            --json
