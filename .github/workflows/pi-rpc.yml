name: Pi RPC compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pi-rpc-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify immutable source revision
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix tests/fixtures/pi-runtime
      - run: npm run test:pi-rpc-real
        env:
          PI_RPC_E2E_COMMAND: ${{ github.workspace }}/tests/fixtures/pi-runtime/node_modules/.bin/pi

  windows-cmd-rpc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify immutable source revision
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run tests/server/coding-agent-run-manager-windows-real.test.ts
